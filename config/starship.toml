disabled = true

[php]
disabled = true

[pijul_channel]
symbol = " "
style = "bold purple"
format = "on [$symbol$channel]($style) "
truncation_length = 9223372036854775807
truncation_symbol = "…"
disabled = true

[pixi]
disabled = true

[pulumi]
disabled = true

[purescript]
disabled = true

[python]
disabled = true

[quarto]
disabled = true

[raku]
disabled = true

[red]
disabled = true

[rlang]
disabled = true

[ruby]
disabled = true

[rust]
disabled = true

[scala]
disabled = true

[shell]
disabled = true

[shlvl]
# This replaces the VIM variable check.
disabled = false

[singularity]
disabled = true

[solidity]
disabled = true

[spack]
disabled = true

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "❌"
success_symbol = ""
not_executable_symbol = "🚫"
not_found_symbol = "🔍"
sigint_symbol = "🧱"
signal_symbol = "⚡"
style = "bold red"
map_symbol = false
recognize_signal_code = true
pipestatus = false
pipestatus_separator = "|"
pipestatus_format = '\[$pipestatus\] => [$symbol$common_meaning$signal_name$maybe_int]($style) '

[sudo]
format = "[as $symbol]($style)"
symbol = "🧙 "
style = "bold blue"
allow_windows = false
disabled = true

[swift]
disabled = true

[terraform]
disabled = true

[time]
format = "at [$time]($style) "
style = "bold yellow"
use_12hr = false
disabled = true
utc_time_offset = "local"
time_range = "-"

[typst]
format = "via [$symbol($version )]($style)"
version_format = "v${raw}"
symbol = "t "
style = "bold #0093A7"
disabled = false
detect_extensions = ["typ"]
detect_files = ["template.typ"]
detect_folders = []

[username]
detect_env_vars = []
format = "[$user]($style) in "
style_root = "red bold"
style_user = "yellow bold"
show_always = false
disabled = false

[username.aliases]

[vagrant]
disabled = true

[vcsh]
disabled = true

[vlang]
disabled = true

[xmake]
disabled = true

[zig]
disabled = true

[custom]

[custom.prompt]
description = "The user set prompt tag"
when = true
format = '$output'
shell = ['echo', '$(prompt)']
unsafe_no_escape = true

[custom.title]
description = "Set window title with Bash escapes."
when = true
format = '$output'
shell = ['echo', '\[\e]0;$(prompt)\u@\h: \w\a\]']
unsafe_no_escape = true
